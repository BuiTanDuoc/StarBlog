version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ClinicManagementDb;User Id=sa;Password=${SA_PASSWORD:?Set SA_PASSWORD in .env};TrustServerCertificate=True
      - Jwt__Secret=${JWT_SECRET:?Set JWT_SECRET in .env — base64, at least 32 bytes}
      - Jwt__Issuer=ClinicManagement.API
      - Jwt__Audience=ClinicManagement.Clients
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - clinicnet

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD:?Set SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - clinicnet

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - clinicnet

volumes:
  sqlserver-data:

networks:
  clinicnet:
